name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'python/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e python

      # The land-use tests that check real places — Heathrow is an airport,
      # Tokyo is not offshore — skip themselves when these layers are absent.
      # Without this they would skip in CI and the coverage would be imaginary.
      # The download is best-effort: if it fails the tests skip as before
      # rather than turning a Natural Earth outage into a red build.
      - name: Cache Natural Earth layers
        uses: actions/cache@v4
        with:
          path: data/.ne-cache
          key: ne-layers-${{ hashFiles('scripts/classify_scenes.py') }}

      - name: Warm the Natural Earth cache
        continue-on-error: true
        run: |
          python -c "
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location('cs', 'scripts/classify_scenes.py')
          cs = importlib.util.module_from_spec(spec); spec.loader.exec_module(cs)
          cs.fetch_layers(pathlib.Path('data/.ne-cache'))
          print('layers ready')
          "

      - name: Run tests
        run: pytest tests/ -q

      # The client must keep working with no optional dependencies installed,
      # since that is how most people will install it.
      - name: Verify the client has no hidden dependencies
        if: matrix.python-version == '3.11'
        run: |
          pip uninstall -y pandas matplotlib pyarrow shapely 2>/dev/null || true
          python -c "
          from opensartriad import Catalog, Scene, FAMILIES
          s = Scene('x', 'umbra', '2025-01-01', 'spotlight', None, None,
                    formats=['GEC', 'SICD'], bbox=[0, 0, 1, 1])
          assert s.resolve('complex') == 'SICD'
          assert s.resolve('detected') == 'GEC'
          print('client imports and resolves with zero optional deps')

          # Plotting must fail with a useful hint rather than a bare ImportError.
          try:
              s.plot_footprint()
              raise SystemExit('plotting should have required matplotlib')
          except ImportError as e:
              assert 'open-sar-triad[plot]' in str(e), e
              print('plotting raises the documented install hint')
          "

  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The real catalog is committed, so this checks the builder and the
      # validator against production data rather than fixtures.
      - name: Validate the committed catalog
        run: python scripts/validate_catalog.py

      - name: Build the API from the real catalog
        run: |
          python scripts/build_api.py
          test -f api/v1/catalog.json
          test -f api/v1/index.json
          python -c "
          import json, pathlib
          files = list(pathlib.Path('api/v1').rglob('*'))
          files = [f for f in files if f.is_file()]
          assert len(files) == 12, files
          for f in files:
              d = json.loads(f.read_text())
              assert d['license'] == 'CC-BY-4.0', f
          idx = json.loads(pathlib.Path('api/v1/index.json').read_text())
          st  = json.loads(pathlib.Path('api/v1/stats.json').read_text())
          assert idx['count'] == st['total'] > 0
          print(f\"api built from real catalog: {st['total']} scenes, {len(files)} files\")
          "

  # One report for the whole workflow, not one per matrix leg: three jobs each
  # opening and updating the same issue would fight each other.
  #
  # Pull requests are excluded deliberately. A contributor's failing PR is not a
  # problem with main, and a fork's token has no issues:write anyway, so firing
  # here would be noise at best and a confusing failure at worst.
  report:
    needs: [test, build-api]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report test health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-api.result }}
        run: |
          python - <<'PY'
          import json, os, pathlib

          jobs = {"the test matrix (3.9, 3.11, 3.12)": os.environ["TEST_RESULT"],
                  "the API build from the real catalog": os.environ["BUILD_RESULT"]}
          # "skipped" is not a failure; "cancelled" is not worth waking anyone.
          bad = {n: r for n, r in jobs.items() if r not in ("success", "skipped", "cancelled")}

          report = {
              "ok": not bad,
              "errors": [f"{n} {r}" for n, r in sorted(bad.items())],
              "warnings": [],
              "subject": "Test suite",
              "on_error_note": ("`main` does not pass its own tests. Whatever is "
                                "on the branch now is not known-good, and the "
                                "next ingest or deploy will build on it anyway."),
          }
          pathlib.Path("/tmp/tests-health.json").write_text(json.dumps(report))
          print("ok" if report["ok"] else "failing: " + "; ".join(report["errors"]))
          PY
          python scripts/report_health.py \
            --report /tmp/tests-health.json --label tests-health
