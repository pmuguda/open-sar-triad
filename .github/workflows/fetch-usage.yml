name: Fetch Search Console Usage

on:
  schedule:
    - cron: '0 4 * * *'    # daily at 04:00 UTC (GSC data lags ~2-3 days)
  workflow_dispatch:        # manual trigger

jobs:
  usage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write       # to dispatch the deploy after pushing usage.json
      issues: write        # the health reporter opens and closes one issue

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-usage.txt

      # Exits 0 with a notice when the secret is not configured yet, so this job
      # stays green until the one-time service-account setup is done.
      - name: Fetch Search Console stats
        id: fetch
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # Comma-separated properties, merged. Each must match the Search Console
          # property string exactly (scheme, host, trailing slash). The app is
          # reachable at both the canonical URL and the GitHub Pages URL.
          GSC_SITE_URL: https://www.pmuguda.com/open-sar-triad/,https://pmuguda.github.io/open-sar-triad/
          # Empty: both properties are already scoped to /open-sar-triad/, and a
          # page filter would force "by page" aggregation that drops country rows.
          GSC_PAGE_CONTAINS: ""
          GSC_WINDOW_DAYS: 90
        run: python scripts/fetch_gsc.py

      - name: Commit updated usage data
        id: commit
        run: |
          if [ ! -f data/usage.json ]; then
            echo "No usage.json produced (not configured); nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usage.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update usage stats [$(date -u '+%Y-%m-%d')]"
            # Rebases and retries if main moved while this ran; see the script.
            bash scripts/git_push_retry.sh origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same reason as in fetch-data.yml: a push made with GITHUB_TOKEN starts
      # no push-triggered workflow, so the site's visitor counts only moved when
      # someone pushed code. Dispatch the deploy explicitly.
      - name: Deploy the new usage data
        id: deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      # This was the one scheduled workflow that told nobody when it broke: an
      # expired Search Console key would leave the visitor map frozen with a
      # red run on a page nobody opens. Same reporter as the others, its own
      # label, so it cannot close or overwrite their issues.
      - name: Report usage health
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH: ${{ steps.fetch.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          steps = {
              "fetching the Search Console statistics (scripts/fetch_gsc.py)": os.environ["FETCH"],
              "committing and pushing data/usage.json": os.environ["COMMIT"],
              "starting the deploy for the new statistics": os.environ["DEPLOY"],
          }
          # "skipped" is a step that had nothing to do, not one that broke,
          # unless it was skipped because an earlier one failed, which that
          # earlier step already accounts for.
          bad = [name for name, outcome in steps.items() if outcome == "failure"]
          pathlib.Path("/tmp/usage-health.json").write_text(json.dumps({
              "ok": not bad, "warnings": [],
              "errors": [f"{name} failed" for name in bad],
              "subject": "Usage statistics",
              "on_error_note": ("The visitor map is showing the last statistics "
                                "that were fetched successfully."),
          }))
          print("ok" if not bad else "failing: " + "; ".join(bad))
          PY
          python scripts/report_health.py \
            --report /tmp/usage-health.json --label usage-health
