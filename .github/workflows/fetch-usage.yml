name: Fetch Search Console Usage

on:
  schedule:
    - cron: '0 4 * * *'    # daily at 04:00 UTC (GSC data lags ~2-3 days)
  workflow_dispatch:        # manual trigger

jobs:
  usage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-usage.txt

      # Exits 0 with a notice when the secret is not configured yet, so this job
      # stays green until the one-time service-account setup is done.
      - name: Fetch Search Console stats
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # Comma-separated properties, merged. Each must match the Search Console
          # property string exactly (scheme, host, trailing slash). The app is
          # reachable at both the canonical URL and the GitHub Pages URL.
          GSC_SITE_URL: https://www.pmuguda.com/open-sar-triad/,https://pmuguda.github.io/open-sar-triad/
          # Empty: both properties are already scoped to /open-sar-triad/, and a
          # page filter would force "by page" aggregation that drops country rows.
          GSC_PAGE_CONTAINS: ""
          GSC_WINDOW_DAYS: 90
        run: python scripts/fetch_gsc.py

      - name: Commit updated usage data
        run: |
          if [ ! -f data/usage.json ]; then
            echo "No usage.json produced (not configured); nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usage.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update usage stats [$(date -u '+%Y-%m-%d')]"
            git push
          fi
