name: Fetch SAR Catalog Data

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch:        # manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch catalogs
        run: python scripts/fetch_catalog.py

      # Gate the commit. The catalog has just been rewritten but not committed,
      # so HEAD still holds the previous version and the validator can diff
      # against it. A failure here means nothing bad is ever committed or
      # deployed: the site keeps serving the last good catalog.
      - name: Validate catalog
        run: python scripts/validate_catalog.py --json /tmp/validation.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-validation
          path: /tmp/validation.json
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scenes.geojson
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update SAR scene data [$(date -u '+%Y-%m-%d')]"
            git push
          fi
