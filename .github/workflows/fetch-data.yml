name: Fetch SAR Catalog Data

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch:        # manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write        # the health reporter opens and closes one issue
      actions: write       # to dispatch the deploy after pushing the catalog

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch catalogs
        id: fetch
        run: python scripts/fetch_catalog.py

      # Tags each scene with what a map says is at its location. Incremental:
      # tags carry forward from the committed catalog, so only genuinely new
      # scenes are classified and a weekly run is seconds rather than minutes.
      # OSM enrichment is off here; see scripts/classify_scenes.py --osm.
      # The classifier's map layers and elevation tiles. Without this every run
      # with a new scene downloads them again, which is both slow and one more
      # thing that can fail on the day. The key changes every run so the cache
      # is saved again with whatever tiles were added; restore-keys picks up
      # the most recent one.
      - name: Restore the classifier's map and elevation cache
        continue-on-error: true     # a cache outage must not cost the ingest
        uses: actions/cache@v6
        with:
          path: |
            data/.ne-cache
            data/.dem-cache
          key: classify-${{ github.run_id }}
          restore-keys: classify-

      - name: Classify scene locations
        id: classify
        run: python scripts/classify_scenes.py

      # Gate the commit. The catalog has just been rewritten but not committed,
      # so HEAD still holds the previous version and the validator can diff
      # against it. A failure here means nothing bad is ever committed or
      # deployed: the site keeps serving the last good catalog.
      - name: Validate catalog
        id: validate
        run: python scripts/validate_catalog.py --json /tmp/validation.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-validation
          path: /tmp/validation.json
          if-no-files-found: ignore

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scenes.geojson
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update SAR scene data [$(date -u '+%Y-%m-%d')]"
            # Not a bare `git push`: the usage workflow and people push to main
            # too, and losing that race used to throw the week's catalog away.
            bash scripts/git_push_retry.sh origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # The push above does not deploy. GitHub never starts push-triggered
      # workflows for commits made with the workflow's own GITHUB_TOKEN, so for
      # as long as this job relied on deploy.yml "picking up the push", the new
      # catalog only reached the site when a person happened to push code
      # afterwards. The week nobody did, the site served the old count while
      # the repository, the ingest and every check on it read healthy.
      # workflow_dispatch is the one event that token may raise, so raise it.
      - name: Deploy the new catalog
        id: deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      # The point of this job is that you never have to come and look at it.
      # It runs on success and on failure: a crash in fetch or validate leaves
      # no report behind, so one is synthesised naming the step that died.
      - name: Report ingest health
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/validation.json ]; then
            if [ "${{ steps.fetch.outcome }}" != "success" ]; then
              reason="scripts/fetch_catalog.py failed, so no catalog was produced. Upstream may have changed shape again."
            elif [ "${{ steps.classify.outcome }}" != "success" ]; then
              reason="scripts/classify_scenes.py failed, so the catalog was never validated or committed."
            elif [ "${{ steps.validate.outcome }}" = "skipped" ]; then
              reason="the run stopped before the catalog could be validated, so nothing was committed."
            else
              reason="scripts/validate_catalog.py did not produce a report; it likely crashed before finishing."
            fi
            python - "$reason" <<'PY'
          import json, sys, pathlib
          pathlib.Path("/tmp/validation.json").write_text(json.dumps({
              "ok": False, "errors": [sys.argv[1]], "warnings": [],
          }))
          PY
          fi
          # A catalog that passed validation but could not be pushed is lost
          # unless someone hears about it: the report on disk says healthy.
          if [ "${{ steps.commit.outcome }}" = "failure" ]; then
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/validation.json")
          rep = json.loads(p.read_text())
          rep["ok"] = False
          rep.setdefault("errors", []).append(
              "the catalog passed validation but could not be committed and "
              "pushed to main, so this run's scenes were not published. "
              "Re-run the Fetch SAR Catalog Data workflow.")
          rep["on_error_note"] = ("The catalog **was not committed**. The site "
                                  "is still serving the last good data.")
          p.write_text(json.dumps(rep))
          PY
          fi
          # A catalog that was committed but never sent to the site is the
          # failure above all over again, so a failed dispatch is an error in
          # the report rather than only a red step.
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/validation.json")
          rep = json.loads(p.read_text())
          rep["ok"] = False
          rep.setdefault("errors", []).append(
              "the new catalog was pushed but dispatching deploy.yml failed, "
              "so the site is still serving the previous catalog. Run the "
              "Deploy workflow by hand.")
          rep.setdefault("on_error_note",
              "The catalog **was committed** but is not on the site yet.")
          p.write_text(json.dumps(rep))
          PY
          fi
          python scripts/report_health.py --report /tmp/validation.json
