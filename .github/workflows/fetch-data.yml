name: Fetch SAR Catalog Data

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch:        # manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write        # the health reporter opens and closes one issue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch catalogs
        id: fetch
        run: python scripts/fetch_catalog.py

      # Tags each scene with what a map says is at its location. Incremental:
      # tags carry forward from the committed catalog, so only genuinely new
      # scenes are classified and a weekly run is seconds rather than minutes.
      # OSM enrichment is off here; see scripts/classify_scenes.py --osm.
      - name: Classify scene locations
        id: classify
        run: python scripts/classify_scenes.py

      # Gate the commit. The catalog has just been rewritten but not committed,
      # so HEAD still holds the previous version and the validator can diff
      # against it. A failure here means nothing bad is ever committed or
      # deployed: the site keeps serving the last good catalog.
      - name: Validate catalog
        id: validate
        run: python scripts/validate_catalog.py --json /tmp/validation.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-validation
          path: /tmp/validation.json
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scenes.geojson
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update SAR scene data [$(date -u '+%Y-%m-%d')]"
            git push
          fi

      # The point of this job is that you never have to come and look at it.
      # It runs on success and on failure: a crash in fetch or validate leaves
      # no report behind, so one is synthesised naming the step that died.
      - name: Report ingest health
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/validation.json ]; then
            if [ "${{ steps.fetch.outcome }}" != "success" ]; then
              reason="scripts/fetch_catalog.py failed, so no catalog was produced. Upstream may have changed shape again."
            else
              reason="scripts/validate_catalog.py did not produce a report; it likely crashed before finishing."
            fi
            python - "$reason" <<'PY'
          import json, sys, pathlib
          pathlib.Path("/tmp/validation.json").write_text(json.dumps({
              "ok": False, "errors": [sys.argv[1]], "warnings": [],
          }))
          PY
          fi
          python scripts/report_health.py --report /tmp/validation.json
